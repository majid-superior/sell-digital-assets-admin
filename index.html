<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${escapeHtml(organization.title)} | Admin</title>
    <!-- Synchronous theme detection & dynamic tokens injection to prevent FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          }

          var cachedThemeCss = localStorage.getItem("theme_css");
          if (cachedThemeCss) {
            var styleEl = document.createElement("style");
            styleEl.id = "dynamic-theme-vars";
            styleEl.textContent = cachedThemeCss;
            document.head.appendChild(styleEl);
          }

          var cachedOrgTitle = localStorage.getItem("organization_title");
          if (cachedOrgTitle) {
            document.title = cachedOrgTitle + " | Admin";
          }
          var cachedFavicon = localStorage.getItem("organization_favicon");
          if (cachedFavicon) {
            var favEl = document.querySelector("link[rel*='icon']");
            if (favEl) favEl.href = cachedFavicon;
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-background text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
